server:
  port: 8080

spring:
  application:
    name: saasify-core
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/saasify_db
    username: postgres
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

saasify:
  security:
    api-keys: ${SAASIFY_API_KEYS:}
    webhook-secret: ${SAASIFY_WEBHOOK_SECRET:}
    webhook-tolerance: ${SAASIFY_WEBHOOK_TOLERANCE:5m}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always