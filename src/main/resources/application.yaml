server:
  port: 8080

spring:
  application:
    name: saasify-core
  datasource:
    url: jdbc:postgresql://localhost:5432/saasify_db
    username: postgres
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

      spring:
        threads:
          virtual:
            enabled: true